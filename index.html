<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.amcharts.com; style-src 'self' 'unsafe-inline';">
    <title>A Journey around the world</title>
    <meta name="author" content="Jeremy Baffou, Camille Pitet, Renuka Singhvirk">
    <!-- Link to your stylesheet -->
    <link rel="stylesheet" href="src/style.css">
    
    <!-- You can also include any in-page styles if needed -->
    <style>
      /* Example inline style for elements not covered in style.css */
      svg.axis {
        stroke-width: 1;
        stroke: rgb(200, 200, 200);
      }
      svg text {
        fill: rgb(200, 200, 200);
        font-size: 4px;
        text-anchor: middle;
      }
    </style>
  </head>
  <body>
    
    <!-- This SVG is left from your previous version if needed.
         The interactive globe and bar modules will be dynamically created in page.js -->
    <svg id="plot" viewBox="-10 -10 220 120" width="100%" height="100%">
      <style>
        .axis {
          stroke-width: 1;
          stroke: rgb(200, 200, 200);
        }
        text {
          fill: rgb(200, 200, 200);
          font-size: 4px;
          text-anchor: middle;
        }
      </style>
    </svg>
    
    <!-- Include the required amCharts libraries -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    
    <!-- Include d3 (from your local library) -->
    <script src="src/lib/d3.min.js"></script>
    
    <!-- Include your main JavaScript file -->
    <script src="src/page.js"></script>
  </body>
</html>
